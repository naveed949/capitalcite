[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capitalcite"
version = "0.1.0"
description = "Cited, evaluated RAG over U.S. bank filings."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Naveed Iqbal" }]
keywords = ["rag", "fastapi", "sec", "edgar", "banking"]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.115,<1",
    "httpx>=0.27,<1",
    "langfuse>=5,<6",
    "langgraph>=1.0,<2",
    "mcp>=2,<3",
    "neo4j>=5,<6",
    "pydantic-settings>=2.6,<3",
    "pypdf>=6.20.1",
    "qdrant-client[fastembed]>=1.14,<2",
    "typer>=0.15,<1",
]

[project.scripts]
capitalcite = "capitalcite.cli:app"

[project.urls]
Repository = "https://github.com/naveed949/capitalcite"
Issues = "https://github.com/naveed949/capitalcite/issues"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-beautifulsoup4>=4.12.0.20250516",
]
metrics = [
    "dbt-core==1.12.6",
    "dbt-duckdb==1.11.0",
    "dbt-metricflow==0.15.0",
]

[tool.hatch.build.targets.wheel.force-include]
"src/capitalcite/gate/tools.json" = "capitalcite/gate/tools.json"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["capitalcite"]

[tool.ruff.lint.per-file-ignores]
# Typer/FastAPI declare options as default factories; B008 is the framework pattern.
"src/capitalcite/cli.py" = ["B008"]
"evals/golden/author.py" = ["E501", "RUF001"]
"tests/test_sections_real.py" = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["duckdb", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-q", "--strict-markers"]
markers = [
  "mf: re-runs mf against the ci warehouse. The dbt CI job runs this marker.",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
