[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capitalcite"
version = "0.1.0"
description = "Cited, evaluated RAG over U.S. bank filings."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Naveed Iqbal" }]
keywords = ["rag", "fastapi", "sec", "edgar", "banking"]
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.6,<3",
    "typer>=0.15,<1",
]

[project.scripts]
capitalcite = "capitalcite.cli:app"

[project.urls]
Repository = "https://github.com/naveed949/capitalcite"
Issues = "https://github.com/naveed949/capitalcite/issues"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["capitalcite"]

[tool.ruff.lint.per-file-ignores]
# Typer/FastAPI declare options as default factories; B008 is the framework pattern.
"src/capitalcite/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-q", "--strict-markers"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
