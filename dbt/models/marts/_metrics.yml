version: 2

semantic_models:
  - name: bank_financials_quarterly
    description: >
      Quarterly bank financials. Every metric filters entity_level so a
      holding company and its lead bank are not added together.
    model: ref('fct_bank_financials_quarterly')
    defaults:
      agg_time_dimension: quarter_id
    entities:
      - name: bank
        type: primary
        expr: bank_key
    dimensions:
      - name: quarter_id
        type: time
        type_params:
          time_granularity: day
      - name: entity_level
        type: categorical
    measures:
      - name: assets_usd
        description: Holding-company assets, whole USD.
        agg: sum
        expr: assets_usd
        non_additive_dimension:
          name: quarter_id
          window_choice: max
      - name: deposits_usd
        description: Holding-company deposits, whole USD.
        agg: sum
        expr: deposits_usd
        non_additive_dimension:
          name: quarter_id
          window_choice: max
      - name: net_income_quarter_usd
        description: Holding-company quarterly net income, whole USD.
        agg: sum
        expr: net_income_quarter_usd
      - name: assets_usd_thousands
        description: Lead-bank assets, thousands of USD.
        agg: sum
        expr: assets_usd_thousands
        non_additive_dimension:
          name: quarter_id
          window_choice: max
      - name: deposits_usd_thousands
        description: Lead-bank deposits, thousands of USD.
        agg: sum
        expr: deposits_usd_thousands
        non_additive_dimension:
          name: quarter_id
          window_choice: max
      - name: net_income_ytd_usd_thousands
        description: Lead-bank year-to-date net income, thousands of USD.
        agg: sum
        expr: net_income_ytd_usd_thousands
        non_additive_dimension:
          name: quarter_id
          window_choice: max
      - name: net_income_quarter_usd_thousands
        description: Lead-bank quarterly net income, thousands of USD.
        agg: sum
        expr: net_income_quarter_usd_thousands

metrics:
  - name: holding_company_assets_usd
    description: Holding-company assets in whole USD. Do not add to bank assets.
    type: simple
    type_params:
      measure: assets_usd
    filter: "{{ Dimension('bank__entity_level') }} = 'holding_company'"
  - name: bank_subsidiary_assets_usd_thousands
    description: Lead-bank assets in thousands of USD. Do not add to holding-company assets.
    type: simple
    type_params:
      measure: assets_usd_thousands
    filter: "{{ Dimension('bank__entity_level') }} = 'bank_subsidiary'"
  - name: holding_company_deposits_usd
    description: Holding-company deposits in whole USD.
    type: simple
    type_params:
      measure: deposits_usd
    filter: "{{ Dimension('bank__entity_level') }} = 'holding_company'"
  - name: bank_subsidiary_deposits_usd_thousands
    description: Lead-bank deposits in thousands of USD.
    type: simple
    type_params:
      measure: deposits_usd_thousands
    filter: "{{ Dimension('bank__entity_level') }} = 'bank_subsidiary'"
  - name: holding_company_net_income_quarter_usd
    description: Holding-company quarterly net income in whole USD.
    type: simple
    type_params:
      measure: net_income_quarter_usd
    filter: "{{ Dimension('bank__entity_level') }} = 'holding_company'"
  - name: bank_subsidiary_net_income_quarter_usd_thousands
    description: Lead-bank quarterly net income in thousands of USD.
    type: simple
    type_params:
      measure: net_income_quarter_usd_thousands
    filter: "{{ Dimension('bank__entity_level') }} = 'bank_subsidiary'"
  - name: bank_subsidiary_net_income_ytd_usd_thousands
    description: Lead-bank year-to-date net income in thousands of USD.
    type: simple
    type_params:
      measure: net_income_ytd_usd_thousands
    filter: "{{ Dimension('bank__entity_level') }} = 'bank_subsidiary'"
