name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, type-check, tests
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: capitalcite-ci ci@example.com
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install package and dev tools
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src tests

      - name: dbt build (ci)
        run: uv run --group metrics dbt build --project-dir dbt --profiles-dir dbt --target ci

      - name: Tests
        env:
          WAREHOUSE_PATH: ${{ github.workspace }}/dbt/target/ci.duckdb
          METRIC_QUERY_BACKEND: catalog
          ASK_MODEL: fake
        run: uv run pytest -m "not mf"

      - name: Write-up number check
        run: uv run python scripts/check_writeup_numbers.py

      - name: Metrics eval
        env:
          WAREHOUSE_PATH: ${{ github.workspace }}/dbt/target/ci.duckdb
          METRIC_QUERY_BACKEND: catalog
          ASK_MODEL: fake
        run: uv run capitalcite eval --suite metrics --out "${RUNNER_TEMP}/eval-metrics"

      - name: Behavioral regression gate
        env:
          WAREHOUSE_PATH: ${{ github.workspace }}/dbt/target/ci.duckdb
          METRIC_QUERY_BACKEND: catalog
          ASK_MODEL: fake
        run: uv run capitalcite check --out "${RUNNER_TEMP}/check"

      - name: Retrieval eval (small)
        run: uv run capitalcite eval --suite golden --small --out "${RUNNER_TEMP}/eval-small"

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install package
        run: uv sync --frozen
        env:
          SEC_USER_AGENT: capitalcite-ci ci@example.com

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.4 --activate

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Check generated API types
        run: pnpm --dir web check:api
        env:
          SEC_USER_AGENT: capitalcite-ci ci@example.com

      - name: Typecheck
        run: pnpm --dir web typecheck

      - name: Lint
        run: pnpm --dir web lint

      - name: Test
        run: pnpm --dir web test

      - name: Build
        run: pnpm --dir web build

  dbt:
    name: dbt warehouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dbt tools
        run: uv sync --frozen --group metrics --group dev

      - name: dbt build (ci)
        env:
          DBT_PROJECT_DIR: ${{ github.workspace }}/dbt
        run: uv run --group metrics dbt build --project-dir dbt --profiles-dir dbt --target ci

      - name: dbt build (ci, documented command)
        run: uv run --group metrics dbt build --project-dir dbt --profiles-dir dbt --target ci

      - name: dbt docs generate (ci)
        env:
          DBT_PROJECT_DIR: ${{ github.workspace }}/dbt
        run: uv run --group metrics dbt docs generate --project-dir dbt --profiles-dir dbt --target ci

      - name: MetricFlow validate and snapshot
        env:
          DBT_PROJECT_DIR: ${{ github.workspace }}/dbt
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
          DBT_TARGET: ci
        run: |
          uv run --group metrics mf validate-configs
          uv run --group metrics --group dev pytest -m mf

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: capitalcite-ci ci@example.com
      APP_ENV: test
      ASK_MODEL: fake
      LANGFUSE_TRACING_ENABLED: "false"
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install package
        run: uv sync --frozen

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.4 --activate

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install Chromium
        run: |
          if [[ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]]; then
            pnpm --dir web exec playwright install chromium
          else
            pnpm --dir web exec playwright install chromium --with-deps
          fi

      - name: Index fixture filings
        run: |
          mkdir -p "${RUNNER_TEMP}/e2e/chunk" "${RUNNER_TEMP}/e2e/qdrant"
          uv run capitalcite chunk \
            --input-dir tests/fixtures/chunking/corpus \
            --output-dir "${RUNNER_TEMP}/e2e/chunk" \
            --chunker section
          QDRANT_PATH="${RUNNER_TEMP}/e2e/qdrant" uv run capitalcite index \
            --input-dir "${RUNNER_TEMP}/e2e/chunk" \
            --chunker section \
            --embedder bge-small

      - name: Build web
        run: pnpm --dir web build
        env:
          ASK_MODEL: fake

      - name: Run Playwright
        env:
          QDRANT_PATH: ${{ runner.temp }}/e2e/qdrant
          GATE_POLICY: ${{ github.workspace }}/web/e2e/fixtures/deny-search.json
          CAPITALCITE_TEST_SLOW_RETRIEVE_MS: "4000"
          CAPITALCITE_API_LOG: ${{ runner.temp }}/e2e/uvicorn.log
          CAPITALCITE_CANCEL_MARKER: ${{ runner.temp }}/e2e/cancel.marker
          CAPITALCITE_API_ORIGIN: http://127.0.0.1:8000
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
          ASK_MODEL: fake
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/e2e"
          cleanup() {
            if [[ -f "${RUNNER_TEMP}/e2e/web.pid" ]]; then
              kill "$(cat "${RUNNER_TEMP}/e2e/web.pid")" 2>/dev/null || true
            fi
            if [[ -f "${RUNNER_TEMP}/e2e/api.pid" ]]; then
              kill "$(cat "${RUNNER_TEMP}/e2e/api.pid")" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          uv run uvicorn capitalcite.api:app --host 127.0.0.1 --port 8000 \
            >"${CAPITALCITE_API_LOG}" 2>&1 &
          echo $! > "${RUNNER_TEMP}/e2e/api.pid"
          ready=0
          for _ in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:8000/health" >/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [[ "${ready}" -ne 1 ]]; then
            echo "API did not become ready"
            cat "${CAPITALCITE_API_LOG}" >&2 || true
            exit 1
          fi
          pnpm --dir web exec next start --hostname 127.0.0.1 --port 3001 \
            >"${RUNNER_TEMP}/e2e/next.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/e2e/web.pid"
          ready=0
          for _ in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:3001/" >/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [[ "${ready}" -ne 1 ]]; then
            echo "Next did not become ready"
            cat "${RUNNER_TEMP}/e2e/next.log" >&2 || true
            exit 1
          fi
          pnpm --dir web exec playwright test

      - name: Stop API and Next
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/e2e/web.pid" ]]; then
            kill "$(cat "${RUNNER_TEMP}/e2e/web.pid")" 2>/dev/null || true
          fi
          if [[ -f "${RUNNER_TEMP}/e2e/api.pid" ]]; then
            kill "$(cat "${RUNNER_TEMP}/e2e/api.pid")" 2>/dev/null || true
          fi

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
