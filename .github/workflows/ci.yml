name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, type-check, tests
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: capitalcite-ci ci@example.com
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install package and dev tools
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src tests

      - name: Tests
        run: uv run pytest

      - name: Write-up number check
        run: uv run python scripts/check_writeup_numbers.py

      - name: Behavioral regression gate
        run: uv run capitalcite check --out "${RUNNER_TEMP}/check"

      - name: Retrieval eval (small)
        run: uv run capitalcite eval --suite golden --small --out "${RUNNER_TEMP}/eval-small"

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install package
        run: uv sync --frozen
        env:
          SEC_USER_AGENT: capitalcite-ci ci@example.com

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.4 --activate

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Check generated API types
        run: pnpm --dir web check:api
        env:
          SEC_USER_AGENT: capitalcite-ci ci@example.com

      - name: Typecheck
        run: pnpm --dir web typecheck

      - name: Lint
        run: pnpm --dir web lint

      - name: Test
        run: pnpm --dir web test

      - name: Build
        run: pnpm --dir web build

  dbt:
    name: dbt warehouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dbt tools
        run: uv sync --frozen --group metrics

      - name: dbt build (ci)
        env:
          DBT_PROJECT_DIR: ${{ github.workspace }}/dbt
        run: uv run --group metrics dbt build --project-dir dbt --profiles-dir dbt --target ci

      - name: dbt build (ci, documented command)
        run: uv run --group metrics dbt build --project-dir dbt --profiles-dir dbt --target ci

      - name: dbt docs generate (ci)
        env:
          DBT_PROJECT_DIR: ${{ github.workspace }}/dbt
        run: uv run --group metrics dbt docs generate --project-dir dbt --profiles-dir dbt --target ci
