name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, type-check, tests
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: capitalcite-ci ci@example.com
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install package and dev tools
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy src tests

      - name: Tests
        run: uv run pytest

      - name: Behavioral regression gate
        run: uv run capitalcite check --out "${RUNNER_TEMP}/check"

      - name: Retrieval eval (small)
        run: uv run capitalcite eval --suite golden --small --out "${RUNNER_TEMP}/eval-small"
