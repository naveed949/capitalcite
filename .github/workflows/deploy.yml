name: Deploy Azure

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Resource group that already has bootstrap.bicep applied
        required: false
        default: rg-capitalcite
      location:
        description: Azure region (unused unless the group already exists)
        required: false
        default: eastus
      parameters:
        description: Bicep parameters file for main.bicep
        required: false
        default: infra/parameters/demo.json

concurrency:
  group: deploy-azure
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  guard:
    name: skip without secrets
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.creds.outputs.skip }}
    steps:
      - name: Check Azure OIDC secrets
        id: creds
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -z "${AZURE_CLIENT_ID}" ] || [ -z "${AZURE_TENANT_ID}" ] || [ -z "${AZURE_SUBSCRIPTION_ID}" ]; then
            echo "UNVERIFIED: AZURE_CLIENT_ID, AZURE_TENANT_ID, or AZURE_SUBSCRIPTION_ID is empty."
            echo "Create GitHub environment azure, apply infra/bootstrap.bicep as Owner, and store those three secrets."
            echo "Live Azure apply and public /health stay UNVERIFIED."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "skip=false" >> "${GITHUB_OUTPUT}"

  deploy:
    name: apply Bicep and image
    needs: guard
    if: needs.guard.outputs.skip == 'false'
    runs-on: ubuntu-latest
    environment: azure
    env:
      AZURE_RESOURCE_GROUP: ${{ github.event.inputs.resource_group }}
      AZURE_LOCATION: ${{ github.event.inputs.location }}
      PARAMS_FILE: ${{ github.event.inputs.parameters }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep
        run: |
          curl -sSL -o "${RUNNER_TEMP}/bicep" \
            https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64
          chmod +x "${RUNNER_TEMP}/bicep"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Require bootstrap
        run: |
          set -euo pipefail
          if ! az group show --name "${AZURE_RESOURCE_GROUP}" >/dev/null 2>&1; then
            echo "Resource group ${AZURE_RESOURCE_GROUP} is missing."
            echo "Create it and apply infra/bootstrap.bicep as Owner / User Access Administrator first."
            exit 1
          fi
          if ! az deployment group show --resource-group "${AZURE_RESOURCE_GROUP}" --name bootstrap >/dev/null 2>&1; then
            echo "Deployment 'bootstrap' is missing on ${AZURE_RESOURCE_GROUP}."
            echo "Apply infra/bootstrap.bicep once as Owner / User Access Administrator."
            exit 1
          fi

      - name: Build and push API image
        id: image
        run: |
          set -euo pipefail
          ACR="$(az deployment group show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name bootstrap \
            --query properties.outputs.acrName.value -o tsv)"
          SERVER="$(az deployment group show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name bootstrap \
            --query properties.outputs.acrLoginServer.value -o tsv)"
          IMAGE="${SERVER}/capitalcite:${GITHUB_SHA}"
          docker build -t "${IMAGE}" .
          az acr login --name "${ACR}"
          docker push "${IMAGE}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --name capitalcite \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file infra/main.bicep \
            --parameters "${PARAMS_FILE}" \
            --parameters "apiImage=${{ steps.image.outputs.image }}"

      - name: Public /health
        run: |
          set -euo pipefail
          FQDN="$(az deployment group show \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --name capitalcite \
            --query properties.outputs.apiFqdn.value -o tsv || true)"
          if [ -z "${FQDN}" ]; then
            echo "UNVERIFIED: no apiFqdn output. Public /health on Azure was not probed."
            exit 0
          fi
          if curl -sf "https://${FQDN}/health"; then
            echo
            echo "https://${FQDN}/health returned 200"
          else
            echo "UNVERIFIED: https://${FQDN}/health did not return 200"
            exit 0
          fi
